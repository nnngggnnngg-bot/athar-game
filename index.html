const suspects=[{id:'noura',name:'نورة الحربي',job:'منسقة المعرض',icon:'👩🏻‍💼',statement:'كنت أراجع قائمة الضيوف في الردهة من 11:05 إلى 11:25. لم أدخل غرفة الأرشيف.',q:'لماذا وُجد توقيعك على سجل مفتاح الأرشيف؟',a:'استلمت المفتاح صباحًا لتجهيز القاعة، وأعدته قبل الافتتاح. تستطيع مراجعة وقت الإرجاع.'},{id:'fahad',name:'فهد العتيبي',job:'مسؤول الأمن',icon:'👨🏻‍✈️',statement:'انقطع بث كاميرا الممر لدقائق بسبب تحديث مجدول. بقيت في غرفة التحكم.',q:'هل كان الانقطاع تحديثًا فعلاً؟',a:'لم أطلب أي تحديث. ظهرت رسالة إعادة تشغيل مفاجئة، وأبلغت الإدارة الساعة 11:18.'},{id:'salem',name:'سالم الدوسري',job:'مرمم الوثائق',icon:'👨🏽‍🔬',statement:'كنت في ورشة الترميم حتى 11:30، ولم ألمس الظرف منذ عرضه.',q:'كيف تفسّر وجود مسحوق ترميم قرب الخزانة؟',a:'مسحوق الترميم موجود في الورشة، لكنني نقلت أدواتي قرب المعرض عصر أمس.'},{id:'layla',name:'ليلى منصور',job:'مديرة المقتنيات',icon:'👩🏽‍💼',statement:'كنت أستقبل المانح في الصالة الرئيسية. الظرف كان في مكانه عند 11:00.',q:'من يعرف رمز خزانة الأرشيف؟',a:'أنا وفهد فقط. لكن يمكن فتحها أيضًا بمفتاح الطوارئ المحفوظ في مكتب الإدارة.'}];
const clues=[{id:'c1',name:'الظرف البديل',icon:'✉️',pic:'letter',desc:'داخل الخزانة ظرف أسود مشابه، لكن ختمه الشمعي حديث ولم يجف تمامًا.',fact:'السارق أعدّ بديلاً مسبقًا؛ ليست سرقة عفوية.'},{id:'c2',name:'سجل المفتاح',icon:'🗝️',pic:'key',desc:'السجل يُظهر أن نورة أعادت المفتاح الساعة 10:42. هناك سطر لاحق أضيف بقلم مختلف الساعة 11:12 دون اسم.',fact:'توقيع نورة لا يثبت أنها أخذت المفتاح وقت السرقة.'},{id:'c3',name:'لقطة الكاميرا',icon:'📹',pic:'camera',desc:'آخر إطار قبل الانقطاع الساعة 11:14 يُظهر شخصًا يحمل حقيبة معدات رمادية ويتجه نحو الممر الخلفي.',fact:'الحقيبة وحدها لا تحدد الهوية.'},{id:'c4',name:'مسحوق أزرق',icon:'🧪',pic:'room',desc:'أثر مسحوق أزرق دقيق على مقبض الخزانة؛ يستخدم لحماية الورق الهش في ورشة الترميم.',fact:'يربط الأثر بمعدات الترميم، لا بشخص واحد يقينًا.'},{id:'c5',name:'سجل التحكم',icon:'💻',pic:'camera',desc:'أُرسلت إعادة تشغيل الكاميرا من جهاز لوحي متصل بشبكة الضيوف عند 11:13، لا من غرفة الأمن.',fact:'حديث فهد عن انقطاع غير مخطط له متسق مع السجل.'},{id:'c6',name:'بطاقة الورشة',icon:'🪪',pic:'room',desc:'استُخدمت بطاقة سالم لفتح باب الورشة الساعة 11:09 ثم 11:26، دون تسجيل خروج من الممر الجانبي.',fact:'سالم كان قريبًا من المكان، لكن سجلات الأبواب لا ترصد الممر الجانبي.'},{id:'c7',name:'فاتورة الشمع',icon:'🧾',pic:'letter',desc:'فاتورة متجر أدوات ترميم باسم سالم قبل يومين: شمع ختم أسود وورق عتيق.',fact:'اشترى سالم مواد مطابقة للظرف البديل.'},{id:'c8',name:'رسالة محذوفة',icon:'📱',pic:'map',desc:'استُعيدت رسالة من جهاز سالم: «سأستبدل الأصل قبل وصول لجنة التقييم. لا أحد سيلاحظ الختم.»',fact:'الرسالة دليل مباشر على خطة الاستبدال، ويجب مقارنتها بالأدلة الأخرى.'}];
function header(title,subtitle){return `<div class="eyebrow" style="margin-top:25px">القضية رقم 001 • المحقق راكان السالم</div><h1 style="margin:9px 0;color:var(--ivory)">${title}</h1><p class="story">${subtitle}</p><div class="progress"><div style="width:${state.stage==='home'?0:state.stage==='intro'?15:state.stage==='investigate'?40:state.stage==='deduce'?75:100}%"></div></div>`}function btn(text,fn,cls='primary'){return `<button class="${cls}" onclick="${fn}">${text}</button>`}
function render(){let s=$('screen');$('stageTag').textContent=state.stage==='home'?'ملف القضية 001':state.stage==='intro'?'الفصل الأول':state.stage==='investigate'?'الفصل الثاني':state.stage==='deduce'?'الفصل الثالث':'الملف مغلق';if(state.stage==='home'){s.innerHTML=`<div class="hero">${photo('envelope','ملف القضية 001 — الظرف الأسود')}<div class="heroText"><div class="eyebrow">ATHAR ORIGINAL • 001</div><h1>قضية الظرف الأسود</h1><p>الظرف اختفى. أربعة مشتبهين. حقيقة واحدة.</p></div></div><div class="meta"><span>🕵️ تحقيق تفاعلي</span><span>⏱️ 30–50 دقيقة</span><span>🔎 8 أدلة</span><span>📱 للجوال</span></div><div class="card"><h3>ملف سري للغاية</h3><p>اختفى ظرف تاريخي نادر من معرض خاص قبل دقائق من وصول لجنة التقييم. كل من في المبنى يملك سببًا للكذب... لكن الأدلة لا تكذب.</p><p>أنت المحقق <b style="color:var(--gold)">راكان السالم</b>. استجوب المشتبهين، افحص مسرح الجريمة، ثم اتخذ قرارك.</p></div>${btn(state.clues.length?'متابعة التحقيق':'افتح ملف القضية',"setStage('intro')")}${btn('بدء لعبة جديدة',"if(confirm('هل تريد مسح تقدم التحقيق؟')){state={stage:'intro',clues:[],interviews:[],chapter:1,hints:0};save();render()}",'secondary')}`}
else if(state.stage==='intro'){s.innerHTML=header('الاختفاء','الفصل الأول — الساعة 11:32 مساءً، دار المقتنيات الخاصة')+`${photo('dossier','دار المقتنيات الخاصة — مسرح الجريمة')}${photo('envelope','الظرف البديل داخل الخزانة')}<div class="card"><span class="stamp">بلاغ عاجل</span><p class="story">أمامك خزانة عرض زجاجية لم تُكسر. الظرف الأسود الأصلي اختفى، وفي مكانه ظرف آخر. تعطل تسجيل الكاميرا في اللحظة الحاسمة. آخر من دخلوا المبنى: منسقة المعرض، مسؤول الأمن، مرمم الوثائق، ومديرة المقتنيات.</p><p class="story">اتصل بك مدير المعرض: «راكان، أمامك ساعة واحدة قبل وصول اللجنة. نحتاج الحقيقة، لا التخمين.»</p></div><div class="card"><h3>مهمتك</h3><p>اجمع ثمانية أدلة، واستمع إلى شهادات الأربعة، ثم حدد المتورط والدافع وطريقة تنفيذ السرقة.</p></div>${btn('ادخل مسرح الجريمة',"setStage('investigate')")}`}
else if(state.stage==='investigate'){s.innerHTML=header('اجمع خيوط الحقيقة',`الفصل الثاني — جمعت ${state.clues.length} من 8 أدلة، واستمعت إلى ${state.interviews.length} من 4 شهادات.`)+`<h2 class="section">🔍 الأدلة المتاحة</h2><div class="grid">${clues.map(c=>`<button class="mini" onclick="openClue('${c.id}')"><img class="thumb" src="${sceneImages[({letter:'envelope',key:'evidence',camera:'phone',room:'dossier',map:'board'})[c.pic]||'evidence']}" alt=""><span class="evidenceIcon">${c.icon}</span><strong>${c.name}</strong><small>${state.clues.includes(c.id)?'✓ تم فحص الدليل':'اضغط لفحص الدليل'}</small></button>`).join('')}</div><h2 class="section">👤 استجواب المشتبهين</h2><div class="grid">${suspects.map(x=>`<button class="mini" onclick="openSuspect('${x.id}')"><img class="thumb" src="${sceneImages.suspects}" alt=""><span class="evidenceIcon">${x.icon}</span><strong>${x.name}</strong><small>${x.job}<br>${state.interviews.includes(x.id)?'✓ تم الاستجواب':'ابدأ الاستجواب'}</small></button>`).join('')}</div><div class="card"><h3>دفتر المحقق</h3>${state.clues.length?state.clues.map(id=>{let c=clues.find(z=>z.id===id);return `<div class="clue"><b>${c.name}:</b> ${c.fact}</div>`}).join(''):'<p>لا توجد أدلة مفحوصة بعد.</p>'}</div>${state.clues.length===8&&state.interviews.length===4?btn('انتقل إلى الاستنتاج النهائي',"setStage('deduce')"):'<div class="notice">لفتح الفصل الأخير: افحص الأدلة الثمانية واستجوب المشتبهين الأربعة.</div>'}<button class="ghost" onclick="showHint()">💡 اطلب تلميحًا</button><div id="hint"></div>`}
else if(state.stage==='deduce'){s.innerHTML=header('لحظة الحقيقة','الفصل الثالث — لا يكفي أن تتهم أحدًا؛ عليك إثبات كيف ولماذا.')+`${photo('board','لوحة التحقيق — اجمع خيوط القضية')}<div class="card"><h3>السؤال الأول: من استبدل الظرف؟</h3>${suspects.map(x=>`<label class="choice"><input type="radio" name="suspect" value="${x.id}"> ${x.name}</label>`).join('')}</div><div class="card"><h3>السؤال الثاني: كيف عُطلت الكاميرا؟</h3><label class="choice"><input type="radio" name="method" value="security"> تحديث رسمي من غرفة الأمن</label><label class="choice"><input type="radio" name="method" value="tablet"> إعادة تشغيل من جهاز على شبكة الضيوف</label><label class="choice"><input type="radio" name="method" value="power"> انقطاع الكهرباء عن المبنى</label></div><div class="card"><h3>السؤال الثالث: ما الدليل الأقوى على التخطيط؟</h3><label class="choice"><input type="radio" name="proof" value="bag"> ظهور حقيبة رمادية</label><label class="choice"><input type="radio" name="proof" value="message"> الرسالة المستعادة مع فاتورة مواد الاستبدال</label><label class="choice"><input type="radio" name="proof" value="key"> توقيع نورة الصباحي على المفتاح</label></div>${btn('أصدر تقرير المحقق',"submitVerdict()")}`}
else if(state.stage==='win'){s.innerHTML=header('أُغلقت القضية','النتيجة — نجحت في ربط الأدلة وكشف خطة الاستبدال.')+`${photo('report','التقرير النهائي للقضية')}<div class="card"><span class="stamp">تم الحل</span><h3 style="margin-top:15px">المتهم: سالم الدوسري</h3><p class="story">جهّز سالم ظرفًا بديلاً باستخدام ورق عتيق وشمع أسود اشتراه قبل يومين. استخدم ممر الورشة الجانبي للوصول إلى الخزانة، ثم عطّل الكاميرا مؤقتًا من جهاز متصل بشبكة الضيوف. مسحوق الترميم، وفاتورة المواد، والرسالة المستعادة تكشف الخطة.</p><p class="story">كان الدافع إخفاء تلف أصاب الوثيقة الأصلية أثناء ترميمها قبل التقييم؛ فاختار الاستبدال بدل الاعتراف. أمّا نورة فكان توقيعها قديمًا، وفهد لم يبدأ إعادة التشغيل، وليلى لم يظهر دليل يربطها بالتنفيذ.</p></div><div class="notice success">🏆 تهانينا أيها المحقق راكان. لقد حللت قضية الظرف الأسود.</div>${btn('العب من جديد',"resetGame()")}`}
else if(state.stage==='retry'){s.innerHTML=header('تقرير غير مكتمل','بعض استنتاجاتك لا تتفق مع الأدلة.')+`<div class="notice">راجع مصدر إعادة تشغيل الكاميرا، وفاتورة الشمع، والرسالة المستعادة. لا تعتمد على الشك وحده.</div>${btn('أعد قراءة ملف الأدلة',"setStage('investigate')")}${btn('حاول الاستنتاج مرة أخرى',"setStage('deduce')",'secondary')}`}}
function openClue(id){let c=clues.find(z=>z.id===id);if(!state.clues.includes(id))state.clues.push(id);save();$('screen').innerHTML=header('الدليل: '+c.name,'افحص الصورة واقرأ تفاصيل محضر الأدلة.')+photo(({letter:'envelope',key:'evidence',camera:'phone',room:'dossier',map:'board'})[c.pic]||'evidence',c.name)+`<div class="card"><h3>تقرير الأدلة</h3><p>${c.desc}</p><div class="clue"><b>ملاحظة راكان:</b> ${c.fact}</div></div>${btn('العودة إلى ملف التحقيق',"setStage('investigate')")}`;window.scrollTo(0,0)}function openSuspect(id){let x=suspects.find(z=>z.id===id);if(!state.interviews.includes(id))state.interviews.push(id);save();$('screen').innerHTML=header('استجواب: '+x.name,x.job)+`<div class="card" style="text-align:center">${photo("suspects","ملف استجواب — "+x.name)}<div style="font-size:46px">${x.icon}</div><h3>${x.name}</h3><span class="tag">محضر استجواب</span></div><div class="dialogue"><b>راكان:</b> أين كنت وقت الاختفاء؟</div><div class="dialogue"><b>${x.name}:</b> ${x.statement}</div><div class="dialogue"><b>راكان:</b> ${x.q}</div><div class="dialogue"><b>${x.name}:</b> ${x.a}</div><div class="card"><h3>تقييم الشهادة</h3><p>قارن أقوال المشتبه بالأدلة المادية. لا تعتبر الشهادة اعترافًا أو دليل براءة نهائيًا.</p></div>${btn('العودة إلى ملف التحقيق',"setStage('investigate')")}`;window.scrollTo(0,0)}function showHint(){state.hints++;save();let hints=['ابدأ بالأدلة التي تحتوي على أوقات دقيقة، ثم قارنها بالشهادات.','ابحث عمّن يملك أدوات إعداد ظرف مطابق، لا عمّن اقترب من الخزانة فقط.','سجل التحكم يكشف مصدر تعطيل الكاميرا، والرسالة المحذوفة تكشف النية.'];$('hint').innerHTML=`<div class="hint">💡 ${hints[Math.min(state.hints-1,2)]}</div>`}function submitVerdict(){let a=document.querySelector('input[name="suspect"]:checked'),b=document.querySelector('input[name="method"]:checked'),c=document.querySelector('input[name="proof"]:checked');if(!a||!b||!c){alert('أجب عن الأسئلة الثلاثة أولاً.');return}setStage(a.value==='salem'&&b.value==='tablet'&&c.value==='message'?'win':'retry')}function resetGame(){state={stage:'home',clues:[],interviews:[],chapter:1,hints:0};save();render()}render();
</script></body></html>
